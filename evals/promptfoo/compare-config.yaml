description: Tuxedo current versus proposed behavior comparison
prompts:
  - file://prompts.py:create_prompt
tests:
  - path: file://tests.py:generate_tests
    config:
      suite: compare
providers:
  - id: openai:codex-sdk
    label: current
    config:
      model_reasoning_effort: medium
      working_dir: '{{ env.TUXEDO_EVAL_WORKSPACE_ROOT }}/{{workspace_key}}/current'
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      enable_streaming: true
      persist_threads: false
      skip_git_repo_check: false
      codex_path_override: '{{ env.TUXEDO_EVAL_CODEX_PATH | default("codex") }}'
      cli_env:
        CODEX_HOME: '{{ env.TUXEDO_EVAL_CODEX_HOME }}'
  - id: openai:codex-sdk
    label: proposed
    config:
      model_reasoning_effort: medium
      working_dir: '{{ env.TUXEDO_EVAL_WORKSPACE_ROOT }}/{{workspace_key}}/proposed'
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      enable_streaming: true
      persist_threads: false
      skip_git_repo_check: false
      codex_path_override: '{{ env.TUXEDO_EVAL_CODEX_PATH | default("codex") }}'
      cli_env:
        CODEX_HOME: '{{ env.TUXEDO_EVAL_CODEX_HOME }}'
