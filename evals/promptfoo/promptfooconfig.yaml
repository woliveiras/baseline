# Development-only behavior evaluation. Promptfoo is not part of the plugin runtime.
description: Baseline behavior evaluation through the local Codex SDK
prompts:
  - file://prompts.py:create_prompt
tests:
  - path: file://tests.py:generate_tests
    config:
      suite: behavior
providers:
  - id: openai:codex-sdk
    label: control
    config:
      model_reasoning_effort: medium
      working_dir: '{{ env.BASELINE_EVAL_WORKSPACE_ROOT }}/{{workspace_key}}/control'
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      web_search_mode: disabled
      enable_streaming: true
      persist_threads: false
      skip_git_repo_check: false
      codex_path_override: '{{ env.BASELINE_EVAL_CODEX_PATH | default("codex") }}'
      cli_env:
        CODEX_HOME: '{{ env.BASELINE_EVAL_CODEX_HOME }}'
  - id: openai:codex-sdk
    label: core
    config:
      model_reasoning_effort: medium
      working_dir: '{{ env.BASELINE_EVAL_WORKSPACE_ROOT }}/{{workspace_key}}/core'
